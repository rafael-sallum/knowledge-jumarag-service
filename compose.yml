name: knowledge-jumarag-service

x-application: &application
  image: ${JUMARAG_IMAGE:-knowledge-jumarag-service:phase1-local}
  build:
    context: .
  environment: &application-environment
    DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-jumarag}
    DATABASE_USER: ${POSTGRES_USER:-jumarag}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    APP_EMBEDDING_PROVIDER: fake
    APP_MIGRATIONS_ENABLED: "false"
    JUMARAG_ADMIN_TOKEN: ${JUMARAG_ADMIN_TOKEN:-local-admin-token-change-before-production-123456}
    JUMARAG_API_KEY_PEPPER: ${JUMARAG_API_KEY_PEPPER:-local-api-key-pepper-change-before-production-123456}
    JUMARAG_MAX_UPLOAD_BYTES: ${JUMARAG_MAX_UPLOAD_BYTES:-1048576}
    JUMARAG_MAX_UPLOAD_SIZE: ${JUMARAG_MAX_UPLOAD_SIZE:-1MB}
    JUMARAG_DEFAULT_EMBEDDING_PROFILE: ${JUMARAG_DEFAULT_EMBEDDING_PROFILE:-phase0-fake-1536}
  networks:
    - application
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jumarag}
      POSTGRES_USER: ${POSTGRES_USER:-jumarag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55433}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - application
    restart: unless-stopped

  migrate:
    <<: *application
    environment:
      <<: *application-environment
      APP_RUNTIME: migrate
      APP_MIGRATIONS_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *application
    environment:
      <<: *application-environment
      APP_RUNTIME: api
      SERVER_PORT: "8080"
    ports:
      - 127.0.0.1:${API_PORT:-8080}:8080
    networks:
      - application
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *application
    environment:
      <<: *application-environment
      APP_RUNTIME: worker
      SERVER_PORT: "8081"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    ports:
      - 127.0.0.1:${WORKER_PORT:-8081}:8081
    networks:
      - application
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:

networks:
  application:
    internal: true
  edge:
