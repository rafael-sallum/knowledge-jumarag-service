spring:
  flyway:
    enabled: true
  main:
    banner-mode: off

app:
  runtime: api
  security:
    admin-token: test-admin-token-with-at-least-thirty-two-characters
    api-key-pepper: test-api-key-pepper-with-at-least-thirty-two-characters
  ingestion:
    max-upload-bytes: 4096
    target-words: 20
    max-words: 30
    overlap-words: 5
    default-embedding-profile: phase0-fake-1536
  embedding:
    provider: fake
    dimensions: 1536
  retrieval:
    embedding-profile: phase0-fake-1536
  answer:
    chat-provider: fake
    retrieval-limit: 8
    minimum-similarity: 0.01
    minimum-token-overlap: 1
    max-question-characters: 4000
    max-context-bytes: 1024
    max-context-depth: 5
    max-evidence-chunks: 6
    max-evidence-characters: 12000
  context:
    rag-max-chunks: 6
    rag-max-characters: 12000
    rag-max-estimated-tokens: 3000
    long-context-max-chunks: 24
    long-context-max-characters: 24000
    long-context-max-estimated-tokens: 6000
    hybrid-neighbor-chunks: 1
    hybrid-max-chunks: 12
    hybrid-max-characters: 18000
    hybrid-max-estimated-tokens: 4500
    auto-strong-similarity: 0.35
