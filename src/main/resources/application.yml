spring:
  application:
    name: knowledge-jumarag-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/jumarag}
    username: ${DATABASE_USER:jumarag}
    password: ${DATABASE_PASSWORD:change-me-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
      minimum-idle: 1
  flyway:
    enabled: ${APP_MIGRATIONS_ENABLED:false}
  jackson:
    default-property-inclusion: non_null

app:
  runtime: ${APP_RUNTIME:api}
  embedding:
    provider: ${APP_EMBEDDING_PROVIDER:fake}
    dimensions: 1536

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ecs
