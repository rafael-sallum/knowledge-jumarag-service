spring:
  application:
    name: knowledge-jumarag-service
  servlet:
    multipart:
      max-file-size: ${JUMARAG_MAX_UPLOAD_SIZE:1MB}
      max-request-size: ${JUMARAG_MAX_UPLOAD_SIZE:1MB}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/jumarag}
    username: ${DATABASE_USER:jumarag}
    password: ${DATABASE_PASSWORD:change-me-local-only}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
      minimum-idle: 1
  flyway:
    enabled: ${APP_MIGRATIONS_ENABLED:false}
  jackson:
    default-property-inclusion: non_null

app:
  runtime: ${APP_RUNTIME:api}
  security:
    admin-token: ${JUMARAG_ADMIN_TOKEN}
    api-key-pepper: ${JUMARAG_API_KEY_PEPPER}
  ingestion:
    max-upload-bytes: ${JUMARAG_MAX_UPLOAD_BYTES:1048576}
    target-words: ${JUMARAG_CHUNK_TARGET_WORDS:650}
    max-words: ${JUMARAG_CHUNK_MAX_WORDS:900}
    overlap-words: ${JUMARAG_CHUNK_OVERLAP_WORDS:100}
    default-embedding-profile: ${JUMARAG_DEFAULT_EMBEDDING_PROFILE:phase0-fake-1536}
  embedding:
    provider: ${APP_EMBEDDING_PROVIDER:fake}
    dimensions: 1536
  answer:
    chat-provider: ${APP_CHAT_PROVIDER:fake}
    retrieval-limit: ${JUMARAG_ANSWER_RETRIEVAL_LIMIT:8}
    minimum-similarity: ${JUMARAG_ANSWER_MINIMUM_SIMILARITY:0.05}
    minimum-token-overlap: ${JUMARAG_ANSWER_MINIMUM_TOKEN_OVERLAP:1}
    max-question-characters: ${JUMARAG_MAX_QUESTION_CHARACTERS:4000}
    max-context-bytes: ${JUMARAG_MAX_CONTEXT_BYTES:8192}
    max-context-depth: ${JUMARAG_MAX_CONTEXT_DEPTH:8}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  structured:
    format:
      console: ecs
