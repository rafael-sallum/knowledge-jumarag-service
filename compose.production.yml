name: knowledge-jumarag-service

x-runtime: &runtime
  image: ${JUMARAG_IMAGE:?Set JUMARAG_IMAGE to an immutable image reference}
  environment: &runtime-environment
    DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    DATABASE_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
    DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    JUMARAG_EMBEDDING_PROVIDER: ${JUMARAG_EMBEDDING_PROVIDER:-fake}
    JUMARAG_CHAT_PROVIDER: ${JUMARAG_CHAT_PROVIDER:-fake}
    APP_MIGRATIONS_ENABLED: "false"
    JUMARAG_ADMIN_TOKEN: ${JUMARAG_ADMIN_TOKEN:?Set JUMARAG_ADMIN_TOKEN}
    JUMARAG_API_KEY_PEPPER: ${JUMARAG_API_KEY_PEPPER:?Set JUMARAG_API_KEY_PEPPER}
    JUMARAG_MAX_UPLOAD_BYTES: ${JUMARAG_MAX_UPLOAD_BYTES:-1048576}
    JUMARAG_MAX_UPLOAD_SIZE: ${JUMARAG_MAX_UPLOAD_SIZE:-1MB}
    JUMARAG_DEFAULT_EMBEDDING_PROFILE: ${JUMARAG_DEFAULT_EMBEDDING_PROFILE:-phase0-fake-1536}
    JUMARAG_RETRIEVAL_EMBEDDING_PROFILE: ${JUMARAG_RETRIEVAL_EMBEDDING_PROFILE:-phase0-fake-1536}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    JUMARAG_OPENAI_EMBEDDING_MODEL: ${JUMARAG_OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    JUMARAG_OPENAI_EMBEDDING_DIMENSIONS: ${JUMARAG_OPENAI_EMBEDDING_DIMENSIONS:-1536}
    JUMARAG_OPENAI_CHAT_MODEL: ${JUMARAG_OPENAI_CHAT_MODEL:-gpt-4.1-mini}
    JUMARAG_OPENAI_TIMEOUT_SECONDS: ${JUMARAG_OPENAI_TIMEOUT_SECONDS:-20}
    JUMARAG_OPENAI_MAX_OUTPUT_TOKENS: ${JUMARAG_OPENAI_MAX_OUTPUT_TOKENS:-256}
    JUMARAG_OPENAI_MAX_EVIDENCE_CHUNKS: ${JUMARAG_OPENAI_MAX_EVIDENCE_CHUNKS:-6}
    JUMARAG_OPENAI_MAX_EVIDENCE_CHARACTERS: ${JUMARAG_OPENAI_MAX_EVIDENCE_CHARACTERS:-12000}
    JUMARAG_PROVIDER_FAILURE_THRESHOLD: ${JUMARAG_PROVIDER_FAILURE_THRESHOLD:-3}
    JUMARAG_PROVIDER_CIRCUIT_OPEN_SECONDS: ${JUMARAG_PROVIDER_CIRCUIT_OPEN_SECONDS:-30}
    JUMARAG_ANSWER_MINIMUM_SIMILARITY: ${JUMARAG_ANSWER_MINIMUM_SIMILARITY:-0.05}
    JUMARAG_MAX_CONTEXT_BYTES: ${JUMARAG_MAX_CONTEXT_BYTES:-8192}
    JUMARAG_MAX_CONTEXT_DEPTH: ${JUMARAG_MAX_CONTEXT_DEPTH:-8}
  networks:
    - application
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - application
    restart: unless-stopped

  migrate:
    <<: *runtime
    environment:
      <<: *runtime-environment
      APP_RUNTIME: migrate
      APP_MIGRATIONS_ENABLED: "true"
      JUMARAG_EMBEDDING_PROVIDER: fake
      JUMARAG_CHAT_PROVIDER: fake
      OPENAI_API_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *runtime
    environment:
      <<: *runtime-environment
      APP_RUNTIME: api
      SERVER_PORT: "8080"
    expose:
      - "8080"
    networks:
      - application
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    <<: *runtime
    environment:
      <<: *runtime-environment
      APP_RUNTIME: worker
      SERVER_PORT: "8081"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:

networks:
  application:
    internal: true
  edge:
    internal: true
